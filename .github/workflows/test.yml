name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROVIDER: demo
      OPENAI_API_KEY: ""
      REVIEW_ACCESS_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
          python scripts/check_static.py
      - name: Frontend logic tests
        run: node --test frontend/tests/*.test.mjs
      - name: Install and build Vite frontend
        working-directory: frontend
        # First connected build generates package-lock.json. Commit it, then use npm ci.
        run: |
          npm install
          npm run build
      - name: Standard browser acceptance
        run: |
          python -m playwright install --with-deps chromium
          python scripts/run.py > /tmp/label-review.log 2>&1 &
          python scripts/wait_ready.py
          python scripts/browser_review.py
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            evidence/*.png
            evidence/browser-tests.json
